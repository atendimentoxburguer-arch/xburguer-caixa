name: Validar X-Burguer Caixa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done

      - name: Validar PWA nativo, isolamento e sistema
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys, struct

          root = Path('.')
          errors = []
          app_version = '4.18.2'
          pwa_revision = 'native-3'

          def png_info(path):
              data = path.read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data) < 33:
                  return None
              width, height, bit_depth, color_type = struct.unpack('>IIBB', data[16:26])
              return width, height, bit_depth, color_type

          manifest = json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('id') != '/xburguer-caixa/caixa-oficial':
              errors.append('Manifest ID oficial do Caixa foi alterado.')
          if manifest.get('scope') != '/xburguer-caixa/':
              errors.append('Manifest scope do Caixa foi alterado.')
          if manifest.get('start_url') != '/xburguer-caixa/caixa.html?app=caixa':
              errors.append('start_url não aponta para a tela oficial do Caixa.')
          if manifest.get('display') != 'standalone':
              errors.append('Modo standalone do Caixa foi alterado.')
          if manifest.get('prefer_related_applications') is not False:
              errors.append('Manifest deve preferir a instalação web nativa.')

          required_pngs = {
              './icons/xburguer-caixa-rounded-192-v3.png': (192, 192),
              './icons/xburguer-caixa-maskable-512-v4150.png': (512, 512),
          }
          manifest_icons = {str(icon.get('src','')): icon for icon in manifest.get('icons', [])}
          for src, expected_size in required_pngs.items():
              if src not in manifest_icons:
                  errors.append(f'Manifest perdeu o ícone obrigatório: {src}')
              path = root / src.removeprefix('./')
              if not path.exists():
                  errors.append(f'Ícone obrigatório ausente: {path}')
              elif png_info(path) is None or png_info(path)[:2] != expected_size:
                  errors.append(f'Ícone PNG inválido ou com tamanho incorreto: {path}')

          rounded_files = {
              root/'icons/xburguer-caixa-rounded-32-v3.png': (32, 32),
              root/'icons/xburguer-caixa-rounded-48-v3.png': (48, 48),
              root/'icons/xburguer-caixa-rounded-192-v3.png': (192, 192),
          }
          for path, expected_size in rounded_files.items():
              if not path.exists():
                  errors.append(f'PNG arredondado ausente: {path}')
              else:
                  info = png_info(path)
                  if info is None or info[:2] != expected_size:
                      errors.append(f'PNG arredondado inválido: {path}')

          index = (root/'index.html').read_text(encoding='utf-8')
          if f'/xburguer-caixa/service-worker.js?v={pwa_revision}' not in index:
              errors.append('Bootstrap não registra o Service Worker PNG atual.')
          if 'manifest.webmanifest?v=pwa-caixa-native-3' not in index:
              errors.append('Bootstrap não aponta para o manifesto PNG atual.')
          if 'xburguer-caixa-rounded-192-v3.png' not in index:
              errors.append('Bootstrap não usa o PNG arredondado do Caixa.')
          if 'xburguer-caixa-rounded-v1.svg' in index:
              errors.append('Bootstrap ainda referencia o SVG incompatível com Windows.')
          if "scope:'/xburguer-caixa/'" not in index:
              errors.append('Bootstrap não limita o Service Worker ao Caixa.')
          if "location.replace('/xburguer-caixa/caixa.html?app=caixa')" not in index:
              errors.append('Bootstrap não abre a tela oficial após preparar o PWA.')
          if 'beforeinstallprompt' in index:
              errors.append('Bootstrap não deve interceptar o instalador nativo do Chrome.')

          caixa = (root/'caixa.html').read_text(encoding='utf-8')
          if 'manifest.webmanifest?v=pwa-caixa-native-3' not in caixa:
              errors.append('Tela do Caixa não aponta para o manifesto PNG atual.')
          for name in ('xburguer-caixa-rounded-32-v3.png', 'xburguer-caixa-rounded-48-v3.png', 'xburguer-caixa-rounded-192-v3.png'):
              if name not in caixa:
                  errors.append(f'Tela do Caixa não carrega {name}.')
          if 'xburguer-caixa-rounded-v1.svg' in caixa:
              errors.append('Tela do Caixa ainda referencia o SVG incompatível com Windows.')
          if 'install-helper.js' in caixa or 'pwa.js' in caixa:
              errors.append('Tela do Caixa ainda carrega camadas antigas de instalação.')
          if caixa.find('identity-guard.js') > caixa.find('@supabase/supabase-js'):
              errors.append('Trava de identidade precisa carregar antes do Supabase.')

          versioned_assets = [
              'style1.css', 'style2.css', 'style3.css', 'style4.css', 'style5.css',
              'responsive.css', 'responsive-polish.css', 'mobile-menu-hotfix.css',
              'mobile-readable.css', 'currency-format.css', 'page-transitions.css',
              'login-transitions.css', 'system-final.css', 'cash-conference-help.css',
              'version.css', 'identity-guard.js', 'storage-namespace.js',
              'app1.js', 'app2.js', 'app3.js', 'app4.js', 'system-hardening.js',
              'app5.js', 'system-guard.js', 'realtime.js', 'mobile-menu-fix.js',
              'currency-format.js', 'automatic-conference.js', 'cash-conference-help.js'
          ]
          for name in versioned_assets:
              if f'{name}?v={app_version}' not in caixa:
                  errors.append(f'Tela do Caixa não carrega {name} na versão {app_version}.')

          sw = (root/'service-worker.js').read_text(encoding='utf-8')
          if 'const CACHE_NAME = "xburguer-caixa-native-v3";' not in sw:
              errors.append('Cache PNG atual do Caixa não está ativo.')
          if 'const APP_PATH = "/xburguer-caixa/";' not in sw:
              errors.append('Service Worker perdeu o caminho exclusivo do Caixa.')
          if '"./caixa.html"' not in sw:
              errors.append('Service Worker não inclui a tela principal do Caixa.')
          for name in ('xburguer-caixa-rounded-32-v3.png', 'xburguer-caixa-rounded-48-v3.png', 'xburguer-caixa-rounded-192-v3.png'):
              if name not in sw:
                  errors.append(f'Service Worker não inclui {name}.')
          if 'xburguer-caixa-rounded-v1.svg' in sw:
              errors.append('Service Worker ainda mantém o SVG incompatível no cache.')
          if 'caches.match(' in sw:
              errors.append('Service Worker usa busca global de cache da origem.')

          legacy = (root/'sw.js').read_text(encoding='utf-8')
          if "service-worker.js?v=native-3" not in legacy:
              errors.append('Service Worker legado não aponta para a revisão PNG atual.')

          identity = (root/'identity-guard.js').read_text(encoding='utf-8')
          if "EXPECTED_PATH='/xburguer-caixa/'" not in identity:
              errors.append('Trava de identidade perdeu o caminho oficial.')
          if "EXPECTED_SUPABASE_HOST='trnngxezppeembrvxkhh.supabase.co'" not in identity:
              errors.append('Trava de identidade perdeu o Supabase oficial do Caixa.')
          if 'validateSupabaseUrl' not in identity or 'window.fetch=function' not in identity:
              errors.append('Trava de identidade não está bloqueando conexões Supabase divergentes.')

          storage = (root/'storage-namespace.js').read_text(encoding='utf-8')
          if "const NS = 'xburguer_caixa::';" not in storage:
              errors.append('Storage do Caixa não usa namespace exclusivo.')

          app1 = (root/'app1.js').read_text(encoding='utf-8')
          if 'trnngxezppeembrvxkhh.supabase.co' not in app1:
              errors.append('Frontend não aponta para o Supabase do Caixa.')

          conference = (root/'automatic-conference.js').read_text(encoding='utf-8')
          if f"const AUTO_VERSION='{app_version}';" not in conference:
              errors.append('Versão interna atual do sistema foi alterada sem revisão.')
          if 'cashCountVerified' not in conference:
              errors.append('Conferência física opcional não foi encontrada.')
          if 'buildSaveWarnings=function' not in conference:
              errors.append('Conferência automática perdeu os avisos de salvamento.')

          hardening = (root/'system-hardening.js').read_text(encoding='utf-8')
          if f"const XB_APP_VERSION='{app_version}';" not in hardening:
              errors.append('Módulo de estabilidade está com versão interna diferente do sistema.')
          if 'pageSize=500' not in hardening:
              errors.append('Carregamento paginado do histórico não foi encontrado.')
          if 'xbIsNetworkError' not in hardening:
              errors.append('Proteção de sessão contra falha de internet não foi encontrada.')
          if 'validateBackupRecords=function' not in hardening:
              errors.append('Validação completa de backup não foi encontrada.')

          app5 = (root/'app5.js').read_text(encoding='utf-8')
          if 'rpc/restore_cash_backup' not in app5:
              errors.append('Restauração atômica de backup não está ativa no frontend.')
          if 'enterOfflineMode' not in app5:
              errors.append('Modo offline seguro não foi encontrado.')
          if 'Descartar e carregar' not in app5:
              errors.append('Proteção contra descarte acidental de rascunho não foi encontrada.')
          if 'openConfirmModal' not in app5:
              errors.append('Confirmações internas do sistema não foram encontradas.')

          runtime_files = [
              root/'index.html', root/'caixa.html', root/'manifest.webmanifest',
              root/'service-worker.js', root/'sw.js', root/'identity-guard.js',
              root/'app1.js', root/'app2.js', root/'app3.js', root/'app4.js', root/'app5.js',
              root/'storage-namespace.js', root/'system-hardening.js',
              root/'automatic-conference.js', root/'realtime.js'
          ]
          forbidden = ['/xburguer-controle/', 'xburguer-consumo-', 'rrslolruacewjijlhpdc']
          for path in runtime_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      errors.append(f'{path}: referência proibida do outro sistema: {token}')
              if 'window.confirm(' in text:
                  errors.append(f'{path}: confirmação nativa do navegador encontrada.')

          if errors:
              print('\n'.join('ERRO: '+e for e in errors))
              sys.exit(1)

          print(f'OK: X-Burguer Caixa {app_version} validado com PNG arredondado compatível, isolamento e proteções funcionais.')
          PY

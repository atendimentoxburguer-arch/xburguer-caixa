name: Validar isolamento Caixa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolamento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir isolamento e PWA do Controle de Caixa
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys

          root = Path('.')
          errors = []

          manifest = json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('id') != '/xburguer-caixa/caixa-app':
              errors.append('Manifest ID do Caixa foi alterado.')
          if manifest.get('scope') != '/xburguer-caixa/':
              errors.append('Manifest scope do Caixa foi alterado.')
          if not str(manifest.get('start_url','')).startswith('/xburguer-caixa/'):
              errors.append('start_url do Caixa saiu do caminho exclusivo.')
          if manifest.get('display') != 'standalone':
              errors.append('Modo standalone do Caixa foi alterado.')

          required_icons = {
              '/xburguer-controle/icons/xburguer-rounded-180.png',
              '/xburguer-controle/icons/xburguer-rounded-192.png',
              '/xburguer-controle/icons/xburguer-rounded-512.png',
              '/xburguer-controle/icons/xburguer-rounded-maskable-512.png'
          }
          manifest_icons = {str(icon.get('src','')) for icon in manifest.get('icons', [])}
          if not required_icons.issubset(manifest_icons):
              errors.append('Manifest não contém os ícones oficiais já validados da X-Burguer.')

          sw_path = root/'service-worker.js'
          if not sw_path.exists():
              errors.append('Service Worker principal do Caixa não existe.')
          else:
              sw = sw_path.read_text(encoding='utf-8')
              if 'const APP_PATH = "/xburguer-caixa/";' not in sw:
                  errors.append('Service Worker do Caixa perdeu o limite de caminho.')
              if 'xburguer-consumo-' in sw:
                  errors.append('Service Worker do Caixa contém cache do Consumo.')

          index = (root/'index.html').read_text(encoding='utf-8')
          if '/xburguer-caixa/service-worker.js' not in index or "scope:'/xburguer-caixa/'" not in index:
              errors.append('Registro do Service Worker do Caixa não está preso ao caminho exclusivo.')

          app1 = (root/'app1.js').read_text(encoding='utf-8')
          if 'trnngxezppeembrvxkhh.supabase.co' not in app1:
              errors.append('Supabase do Caixa foi alterado.')
          if 'rrslolruacewjijlhpdc' in app1:
              errors.append('Caixa contém referência ao banco do outro sistema.')

          if not (root/'storage-namespace.js').exists():
              errors.append('Camada de isolamento do armazenamento local do Caixa não existe.')

          runtime_files = [
              root/'service-worker.js', root/'app1.js', root/'app2.js', root/'app3.js',
              root/'app4.js', root/'app5.js', root/'storage-namespace.js'
          ]
          forbidden = ['rrslolruacewjijlhpdc', 'xburguer-consumo-']
          for path in runtime_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      errors.append(f'{path}: referência proibida do outro sistema: {token}')

          # O Caixa reutiliza apenas os PNGs oficiais do outro projeto, que já são
          # reconhecidos pelo Chrome/Windows. Nenhuma lógica, página ou banco é compartilhado.
          for path in [root/'manifest.webmanifest', root/'index.html']:
              text = path.read_text(encoding='utf-8', errors='ignore')
              refs = [part for part in text.split('"') if '/xburguer-controle/' in part]
              for ref in refs:
                  if not ref.startswith('/xburguer-controle/icons/'):
                      errors.append(f'{path}: referência ao outro projeto fora da pasta de ícones: {ref}')

          if errors:
              print('\n'.join('ERRO: '+e for e in errors))
              sys.exit(1)

          print('OK: Caixa isolado; somente os ícones oficiais X-Burguer são compartilhados.')
          PY

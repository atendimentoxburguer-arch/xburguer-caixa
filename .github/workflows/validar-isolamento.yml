name: Validar isolamento Caixa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolamento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir isolamento total do X-Burguer Caixa
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys

          root = Path('.')
          errors = []

          manifest = json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('id') != '/xburguer-caixa/caixa-app':
              errors.append('Manifest ID do Caixa foi alterado.')
          if manifest.get('scope') != '/xburguer-caixa/':
              errors.append('Manifest scope do Caixa foi alterado.')
          if not str(manifest.get('start_url','')).startswith('/xburguer-caixa/'):
              errors.append('start_url do Caixa saiu do caminho exclusivo.')
          if manifest.get('display') != 'standalone':
              errors.append('Modo standalone do Caixa foi alterado.')

          sw_path = root/'service-worker.js'
          if not sw_path.exists():
              errors.append('Service Worker principal do Caixa não existe.')
          else:
              sw = sw_path.read_text(encoding='utf-8')
              if 'const APP_PATH = "/xburguer-caixa/";' not in sw:
                  errors.append('Service Worker do Caixa perdeu o limite de caminho.')
              if 'const CACHE_NAME = "xburguer-caixa-pwa-' not in sw:
                  errors.append('Cache do Caixa perdeu o namespace exclusivo.')
              if 'caches.match(' in sw:
                  errors.append('Service Worker do Caixa usa busca global de cache da origem.')
              if 'cache.match(' not in sw:
                  errors.append('Service Worker do Caixa não consulta o próprio cache isolado.')

          pwa = (root/'pwa.js').read_text(encoding='utf-8')
          if '/xburguer-caixa/service-worker.js' not in pwa or "scope:'/xburguer-caixa/'" not in pwa:
              errors.append('Registro PWA do Caixa não está preso ao caminho exclusivo.')
          if 'getRegistrations()' not in pwa or 'old.scope!==expectedScope' not in pwa:
              errors.append('PWA do Caixa não limpa workers antigos do próprio escopo.')

          index = (root/'index.html').read_text(encoding='utf-8')
          if 'pwa.js?v=4.16.3' not in index:
              errors.append('Index do Caixa não carrega o registrador PWA oficial.')

          storage = (root/'storage-namespace.js').read_text(encoding='utf-8')
          if "const NS = 'xburguer_caixa::';" not in storage:
              errors.append('Storage do Caixa não usa namespace total exclusivo.')

          app1 = (root/'app1.js').read_text(encoding='utf-8')
          if 'trnngxezppeembrvxkhh.supabase.co' not in app1:
              errors.append('Supabase do Caixa foi alterado.')
          if 'rrslolruacewjijlhpdc' in app1:
              errors.append('Caixa contém referência ao banco do outro sistema.')

          legacy = root/'sw.js'
          if legacy.exists():
              text = legacy.read_text(encoding='utf-8').strip()
              if "importScripts('./service-worker.js?v=4.16.3');" not in text:
                  errors.append('sw.js legado não aponta exclusivamente para o worker oficial do Caixa.')

          runtime_files = [
              root/'index.html', root/'manifest.webmanifest', root/'service-worker.js',
              root/'pwa.js', root/'sw.js', root/'app1.js', root/'app2.js', root/'app3.js',
              root/'app4.js', root/'app5.js', root/'storage-namespace.js'
          ]
          forbidden = ['/xburguer-controle/', 'xburguer-consumo-', 'rrslolruacewjijlhpdc']
          for path in runtime_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      errors.append(f'{path}: referência proibida do outro sistema: {token}')

          if errors:
              print('\n'.join('ERRO: '+e for e in errors))
              sys.exit(1)

          print('OK: X-Burguer Caixa isolado em PWA, cache, storage e banco.')
          PY

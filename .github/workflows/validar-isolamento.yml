name: Validar X-Burguer Caixa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done

      - name: Validar PWA, isolamento e regras atuais
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, struct, sys

          root = Path('.')
          errors = []
          app_version = '4.18.3'

          def need(condition, message):
              if not condition:
                  errors.append(message)

          def read(name):
              path = root / name
              if not path.exists():
                  errors.append(f'Arquivo obrigatório ausente: {name}')
                  return ''
              return path.read_text(encoding='utf-8', errors='ignore')

          def png_size(path):
              data = path.read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data) < 24:
                  return None
              return struct.unpack('>II', data[16:24])

          manifest = json.loads(read('manifest.webmanifest'))
          need(manifest.get('id') == '/xburguer-caixa/caixa-oficial', 'Manifest ID oficial foi alterado.')
          need(manifest.get('scope') == '/xburguer-caixa/', 'Escopo do PWA foi alterado.')
          need(manifest.get('start_url') == '/xburguer-caixa/caixa.html?app=caixa', 'start_url incorreto.')
          need(manifest.get('display') == 'standalone', 'PWA precisa permanecer standalone.')
          need(manifest.get('prefer_related_applications') is False, 'PWA deve preferir instalação web nativa.')

          expected_icons = {
              './icons/xburguer-caixa-rounded-192-v3.png': (192, 192),
              './icons/xburguer-caixa-maskable-512-v4150.png': (512, 512),
          }
          manifest_icons = {str(i.get('src','')) for i in manifest.get('icons', [])}
          for src, size in expected_icons.items():
              need(src in manifest_icons, f'Ícone obrigatório ausente do manifesto: {src}')
              path = root / src.removeprefix('./')
              need(path.exists(), f'Ícone obrigatório não existe: {path}')
              if path.exists():
                  need(png_size(path) == size, f'Ícone com tamanho incorreto: {path}')

          index = read('index.html')
          caixa = read('caixa.html')
          pwa_register = read('pwa-register.js')
          sw = read('service-worker.js')
          legacy = read('sw.js')

          need('pwa-register.js?v=4.18.2-pwa4' in index, 'Bootstrap não carrega o registrador oficial do PWA.')
          need("REVISION='native-4'" in pwa_register, 'Revisão oficial do PWA foi alterada.')
          need("SCOPE='/xburguer-caixa/'" in pwa_register, 'Registrador perdeu o escopo exclusivo do Caixa.')
          need('manifest.webmanifest?v=pwa-caixa-native-4' in caixa, 'Tela principal não usa o manifesto oficial.')
          need('pwa-register.js?v=4.18.2-pwa4' in caixa, 'Tela principal não registra o PWA diretamente.')
          need('const CACHE_NAME = "xburguer-caixa-native-v5-finance-4.18.3";' in sw, 'Cache oficial do PWA não corresponde à revisão financeira atual.')
          need('const APP_PATH = "/xburguer-caixa/";' in sw, 'Service Worker perdeu o caminho exclusivo.')
          need('service-worker.js?v=native-4' in legacy, 'Service Worker legado não aponta para a revisão atual.')

          # Todo recurso local carregado pela tela precisa existir e estar no precache.
          local_refs = set()
          for ref in re.findall(r'(?:src|href)="([^"]+)"', caixa):
              if ref.startswith(('http://','https://','data:','#')):
                  continue
              clean = ref.split('?', 1)[0].lstrip('./')
              if not clean:
                  continue
              local_refs.add(clean)
              need((root / clean).exists(), f'Recurso referenciado não existe: {clean}')
          for ref in sorted(local_refs):
              need(f'"./{ref}"' in sw, f'Recurso local fora do precache offline: {ref}')
          need('caches.match(' not in sw, 'Service Worker não deve pesquisar caches globais da origem.')

          # Ordem: regras puras e integridade financeira precisam estar instaladas antes do app5.
          app5_pos = caixa.find('app5.js')
          for name in ('business-rules.js','delivery-cash.js','automatic-conference.js','bread-summary.js','bread-start-final.js','business-rules-integration.js','financial-integrity.js'):
              pos = caixa.find(name)
              need(pos >= 0 and pos < app5_pos, f'{name} precisa carregar antes do app5.js.')
          need(caixa.find('business-rules.js') < caixa.find('business-rules-integration.js') < caixa.find('financial-integrity.js'), 'Ordem das regras financeiras canônicas foi alterada.')
          need(caixa.find('identity-guard.js') < caixa.find('@supabase/supabase-js'), 'Trava de identidade precisa carregar antes do Supabase.')
          need(caixa.find('system-hardening.js') < caixa.find('data-consistency.js'), 'Normalização deve carregar depois do hardening.')

          identity = read('identity-guard.js')
          need("EXPECTED_PATH='/xburguer-caixa/'" in identity, 'Trava de identidade perdeu o caminho oficial.')
          need("EXPECTED_SUPABASE_HOST='trnngxezppeembrvxkhh.supabase.co'" in identity, 'Supabase oficial do Caixa foi alterado.')
          need('validateSupabaseUrl' in identity and 'window.fetch=function' in identity, 'Trava de identidade não protege as conexões Supabase.')

          storage = read('storage-namespace.js')
          need("const NS = 'xburguer_caixa::';" in storage, 'Storage não usa namespace exclusivo.')

          app1 = read('app1.js')
          need('trnngxezppeembrvxkhh.supabase.co' in app1, 'Frontend não aponta para o Supabase oficial.')

          hardening = read('system-hardening.js')
          need('pageSize=500' in hardening, 'Histórico perdeu paginação de 500 registros.')
          need('xbIsNetworkError' in hardening, 'Proteção de sessão contra falhas de rede ausente.')
          need('validateBackupRecords=function' in hardening, 'Validação completa de backup ausente.')
          need("'deliveryCash'" in hardening, 'Backup/hardening não reconhece Dinheiro (Entregas).')

          rules = read('business-rules.js')
          need("const VERSION='4.18.3';" in rules, 'Módulo canônico está com versão incorreta.')
          need('num(record.opening)+' in rules and 'num(record.cash)+' in rules and 'num(record.deliveryCash)-' in rules and 'num(record.cashOut)' in rules, 'Dinheiro esperado precisa incluir saldo inicial, dinheiro, entregas e retiradas.')
          need('function financialSummaryTotal(record={})' in rules and 'return paymentTotal(record);' in rules, 'Resumo financeiro não pode incluir saldo inicial como pagamento/venda.')
          need('function nextOpeningBalance(previousRecord={})' in rules and 'Math.max(0,expectedCash(previousRecord))' in rules, 'Saldo do próximo fechamento não usa o dinheiro físico remanescente.')

          integrity = read('financial-integrity.js')
          need("const VERSION='4.18.3';" in integrity, 'Camada de integridade financeira está com versão incorreta.')
          need("channels.reduce((total,_,i)=>total+value('v'+i),0)" in integrity, 'Vendas devem ser calculadas exclusivamente pelos canais.')
          need("value('cash')+value('deliveryCash')+value('cardOut')+value('online')+value('deliveryCard')" in integrity, 'Pagamentos devem excluir saldo inicial.')
          need("value('opening')+value('cash')+value('deliveryCash')-value('cashOut')" in integrity, 'Dinheiro esperado deve incluir saldo inicial sem transformá-lo em venda.')
          need("byId('daySales').textContent=money(sales)" in integrity, 'Total de vendas visual não está protegido pela regra canônica.')

          delivery = read('delivery-cash.js')
          need('delivery_cash_sales' in delivery, 'Frontend não mapeia Dinheiro (Entregas) do banco.')
          need("record.deliveryCash=value('deliveryCash')" in delivery, 'Fechamento não salva Dinheiro (Entregas).')

          currency = read('currency-format.js')
          need("'deliveryCash'" in currency, 'Campo Dinheiro (Entregas) não recebe formatação BRL.')

          consistency = read('data-consistency.js')
          need("breads[prefix+'Final']=final" in consistency, 'Normalização não preserva o estoque final informado.')
          need("breads[prefix+'Prod']=start-final" in consistency, 'Produção dos pães não é calculada por Inicial - Final.')

          bread_summary = read('bread-summary.js')
          need("const production=hasStart&&hasFinal?start-final:0" in bread_summary, 'Resumo de pães não calcula produção por Inicial - Final.')
          need("<span>Est. final</span><span>Produção</span><span>Acum. mês</span>" in bread_summary, 'Cabeçalho do controle de pães está desatualizado.')

          bread_rule = read('bread-start-final.js')
          need('idealProd:idealStart-idealFinal' in bread_rule, 'Registro do Pão Ideal não calcula produção corretamente.')
          need('gourmetProd:gourmetStart-gourmetFinal' in bread_rule, 'Registro do Pão Gourmet não calcula produção corretamente.')
          need('O estoque final do ${name} não pode ser maior que o estoque inicial.' in bread_rule, 'Validação de estoque final maior que inicial foi removida.')

          realtime = read('realtime.js')
          need('realtimeStartPromise' in realtime, 'Realtime não serializa tentativas de conexão.')
          need('nextReconnectDelay' in realtime, 'Realtime não possui backoff de reconexão.')
          need('},30000);' in realtime, 'Verificação periódica do Realtime está agressiva demais.')

          online_css = read('online-orders-equal.css')
          need('minmax(0,1fr) minmax(0,1fr)' in online_css, 'Quantidade e valor dos pedidos online deixaram de ter larguras iguais.')

          app5 = read('app5.js')
          need('rpc/restore_cash_backup' in app5, 'Restauração atômica de backup não está ativa.')
          need('enterOfflineMode' in app5, 'Modo offline seguro não está ativo.')
          need('Descartar e carregar' in app5, 'Proteção de rascunho local foi removida.')
          need('openConfirmModal' in app5, 'Confirmações internas foram removidas.')

          readme = read('README.md')
          need(f'Versão funcional atual: **{app_version}**' in readme, 'README está com versão incorreta.')
          need('Saldo Inicial **não é venda**' in readme, 'README não documenta que saldo inicial fica fora das vendas.')
          need('Dinheiro previsto = Saldo Inicial + Dinheiro (Caixa) + Dinheiro (Entregas) - retiradas para despesas' in readme, 'README não documenta corretamente a conferência física.')
          need('Produção = Estoque inicial - Estoque final' in readme, 'README não documenta a regra atual dos pães.')

          runtime_files = [p for p in root.glob('*.js')] + [root/'index.html', root/'caixa.html', root/'manifest.webmanifest']
          forbidden = ['/xburguer-controle/', 'xburguer-consumo-', 'rrslolruacewjijlhpdc']
          for path in runtime_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      errors.append(f'{path}: referência proibida ao outro sistema: {token}')
              if 'window.confirm(' in text:
                  errors.append(f'{path}: confirmação nativa do navegador encontrada.')

          if errors:
              print('\n'.join('ERRO: '+e for e in errors))
              sys.exit(1)

          print('OK: Caixa validado com PWA, isolamento, regra financeira canônica, pães, backup e Realtime resiliente.')
          PY

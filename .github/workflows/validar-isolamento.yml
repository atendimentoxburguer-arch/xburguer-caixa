name: Validar X-Burguer Caixa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done

      - name: Validar PWA, isolamento e regras atuais
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, struct, sys

          root=Path('.')
          errors=[]
          app_version='4.18.3'

          def need(ok,msg):
              if not ok: errors.append(msg)

          def read(name):
              path=root/name
              if not path.exists():
                  errors.append(f'Arquivo obrigatório ausente: {name}')
                  return ''
              return path.read_text(encoding='utf-8',errors='ignore')

          def png_size(path):
              data=path.read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data)<24:return None
              return struct.unpack('>II',data[16:24])

          manifest=json.loads(read('manifest.webmanifest'))
          need(manifest.get('id')=='/xburguer-caixa/caixa-oficial','Manifest ID oficial foi alterado.')
          need(manifest.get('scope')=='/xburguer-caixa/','Escopo do PWA foi alterado.')
          need(manifest.get('start_url')=='/xburguer-caixa/caixa.html?app=caixa','start_url incorreto.')
          need(manifest.get('display')=='standalone','PWA precisa permanecer standalone.')
          need(manifest.get('prefer_related_applications') is False,'PWA deve preferir instalação web nativa.')

          expected_icons={
              './icons/xburguer-caixa-rounded-192-v3.png':(192,192),
              './icons/xburguer-caixa-maskable-512-v4150.png':(512,512),
          }
          manifest_icons={str(i.get('src','')) for i in manifest.get('icons',[])}
          for src,size in expected_icons.items():
              need(src in manifest_icons,f'Ícone obrigatório ausente do manifesto: {src}')
              path=root/src.removeprefix('./')
              need(path.exists(),f'Ícone obrigatório não existe: {path}')
              if path.exists():need(png_size(path)==size,f'Ícone com tamanho incorreto: {path}')

          index=read('index.html')
          caixa=read('caixa.html')
          pwa=read('pwa-register.js')
          sw=read('service-worker.js')
          legacy=read('sw.js')

          need('pwa-register.js?v=4.18.3-pwa5' in index,'Bootstrap não carrega a revisão atual do registrador PWA.')
          need("REVISION='native-5'" in pwa,'Revisão oficial do PWA está incorreta.')
          need("SCOPE='/xburguer-caixa/'" in pwa,'Registrador perdeu o escopo exclusivo do Caixa.')
          need('manifest.webmanifest?v=pwa-caixa-native-5' in caixa,'Tela principal não usa a revisão atual do manifesto.')
          need('pwa-register.js?v=4.18.3-pwa5' in caixa,'Tela principal não registra a revisão atual do PWA.')
          need('const CACHE_NAME = "xburguer-caixa-native-v6-audit-4.18.3";' in sw,'Cache offline não corresponde à auditoria atual.')
          need('const APP_PATH = "/xburguer-caixa/";' in sw,'Service Worker perdeu o caminho exclusivo.')
          need('service-worker.js?v=native-5' in legacy,'Service Worker legado não aponta para a revisão atual.')
          need('cash-conference-help.js' not in caixa and '"./cash-conference-help.js"' not in sw,'Módulo financeiro legado removido voltou a ser carregado.')

          # Todo recurso local carregado pela tela precisa existir e estar no precache.
          local_refs=set()
          for ref in re.findall(r'(?:src|href)="([^"]+)"',caixa):
              if ref.startswith(('http://','https://','data:','#')):continue
              clean=ref.split('?',1)[0].lstrip('./')
              if not clean:continue
              local_refs.add(clean)
              need((root/clean).exists(),f'Recurso referenciado não existe: {clean}')
          for ref in sorted(local_refs):
              need(f'"./{ref}"' in sw,f'Recurso local fora do precache offline: {ref}')
          need('caches.match(' not in sw,'Service Worker não deve pesquisar caches globais da origem.')

          # Ordem das camadas.
          app5_pos=caixa.find('app5.js')
          for name in ('business-rules.js','delivery-cash.js','automatic-conference.js','bread-summary.js','bread-start-final.js','backup-protection.js','business-rules-integration.js','financial-integrity.js'):
              pos=caixa.find(name)
              need(pos>=0 and pos<app5_pos,f'{name} precisa carregar antes do app5.js.')
          need(caixa.find('business-rules.js')<caixa.find('app1.js')<caixa.find('business-rules-integration.js')<caixa.find('financial-integrity.js'),'Ordem das regras financeiras canônicas foi alterada.')
          need(caixa.find('identity-guard.js')<caixa.find('@supabase/supabase-js'),'Trava de identidade precisa carregar antes do Supabase.')
          need(caixa.find('system-hardening.js')<caixa.find('data-consistency.js'),'Normalização deve carregar depois do hardening.')

          identity=read('identity-guard.js')
          need("EXPECTED_PATH='/xburguer-caixa/'" in identity,'Trava de identidade perdeu o caminho oficial.')
          need("EXPECTED_SUPABASE_HOST='trnngxezppeembrvxkhh.supabase.co'" in identity,'Supabase oficial do Caixa foi alterado.')
          need('validateSupabaseUrl' in identity and 'window.fetch=function' in identity,'Trava de identidade não protege as conexões Supabase.')

          storage=read('storage-namespace.js')
          need("const NS = 'xburguer_caixa::';" in storage,'Storage não usa namespace exclusivo.')

          app1=read('app1.js')
          need('trnngxezppeembrvxkhh.supabase.co' in app1,'Frontend não aponta para o Supabase oficial.')
          need('delivery_cash_sales' in app1 and 'cash_count_verified' in app1,'Mapeamento da nuvem perdeu campos financeiros atuais.')
          need('const pageSize=500' in app1,'Carregamento base perdeu paginação de 500 registros.')
          need('let importInProgress=false' in app1,'Estado próprio de importação crítica está ausente.')

          app2=read('app2.js')
          need("const paymentTotal=cash+deliveryCash+n('cardOut')+n('online')+n('deliveryCard')" in app2,'Cálculo-base de pagamentos está incorreto.')
          need("const sales=paymentTotal" in app2,'Venda-base precisa usar exclusivamente o Resumo Financeiro.')
          need("channelSales=v.reduce((a,b)=>a+b,0)" in app2,'Vendas por canal não estão separadas como demonstrativo.')
          need("const expectedCash=opening+cash+deliveryCash-cashOut" in app2,'Cálculo-base de dinheiro esperado não inclui o saldo inicial corretamente.')
          need("summaryTotal:paymentTotal" in app2,'Resumo financeiro voltou a incluir valor indevido.')
          need("paymentDifference:paymentTotal-channelSales" in app2,'Diferença demonstrativa não compara Resumo Financeiro com canais.')
          need("salesBasis:'financial-summary'" in app2,'Registro-base perdeu a identificação da venda financeira canônica.')
          need('rascunho legado preservado porque a migração local falhou' in app2,'Migração de rascunho legado pode voltar a apagar dados em caso de falha local.')

          app3=read('app3.js')
          need('rec.deliveryCash' in app3,'Validação-base não reconhece Dinheiro (Entregas).')
          need("sbRest('rpc/delete_cash_closing'" in app3,'Exclusão-base não usa o RPC protegido.')
          need("r.cashCountVerified?br(r.cashDifference||0):'—'" in app3,'Histórico não trata contagem física opcional corretamente.')
          need("Number(r.cash||0)+Number(r.deliveryCash||0)" in app3,'Dashboard não soma dinheiro do caixa e entregas.')
          need('onclick=' not in app3,'Histórico voltou a gerar handlers inline.')

          app4=read('app4.js')
          need("(r.opening||0)+(r.cash||0)+(r.deliveryCash||0)-(r.cashOut||0)" in app4,'Relatório diário não usa dinheiro esperado canônico.')
          need("reportValueRow('Dinheiro — entregas'" in app4,'Relatório diário não detalha dinheiro das entregas.')
          need("reportValueRow('Total de vendas (Resumo Financeiro)'" in app4,'Relatório diário perdeu a venda oficial do Resumo Financeiro.')
          need("<td>${br(r.deliveryCash||0)}</td>" in app4 and 'colspan="14"' in app4,'Extrato mensal não contém a coluna de dinheiro das entregas.')
          need("['Total de vendas (Resumo Financeiro)',sales]" in app4,'Relatório mensal não usa a venda financeira oficial.')
          need("${br(channelSales)}" in app4,'Total mensal dos canais voltou a usar receita financeira.')
          need("window.XB_APP_VERSION||'4.18.3'" in app4,'Fallback de backup está com versão incorreta.')

          hardening=read('system-hardening.js')
          need('pageSize=500' in hardening,'Histórico protegido perdeu paginação.')
          need('xbIsNetworkError' in hardening,'Proteção de sessão contra falhas de rede ausente.')
          need('validateBackupRecords=function' in hardening,'Validação completa de backup ausente.')
          need("Number(rec.opening||0)+Number(rec.cash||0)+Number(rec.deliveryCash||0)-Number(rec.cashOut||0)" in hardening,'Hardening físico não inclui saldo inicial corretamente.')

          rules=read('business-rules.js')
          need("const VERSION='4.18.3';" in rules,'Módulo canônico está com versão incorreta.')
          need('num(record.opening)+' in rules and 'num(record.cash)+' in rules and 'num(record.deliveryCash)-' in rules and 'num(record.cashOut)' in rules,'Dinheiro esperado canônico está incorreto.')
          need('function financialSummaryTotal(record={})' in rules and 'return paymentTotal(record);' in rules,'Resumo canônico não pode incluir saldo inicial.')
          need('function channelSales(record={})' in rules,'Regra demonstrativa de canais está ausente.')
          need('function nextOpeningBalance(previousRecord={})' in rules and 'Math.max(0,expectedCash(previousRecord))' in rules,'Saldo seguinte não usa o dinheiro físico remanescente.')

          integrity=read('financial-integrity.js')
          need('function formFinancialSales()' in integrity,'Integridade perdeu a venda financeira oficial.')
          need("value('cash')+value('deliveryCash')+value('cardOut')+value('online')+value('deliveryCard')" in integrity,'Integridade: venda financeira inclui/exclui campos incorretos.')
          need('function formChannelSales()' in integrity and "channels.reduce((total,_,i)=>total+value('v'+i),0)" in integrity,'Integridade não mantém canais como demonstrativo separado.')
          need('const sales=formFinancialSales();' in integrity and 'const channelSales=formChannelSales();' in integrity,'Integridade voltou a misturar venda financeira e canais.')
          need("value('opening')+value('cash')+value('deliveryCash')-value('cashOut')" in integrity,'Integridade: dinheiro esperado está incorreto.')

          automatic=read('automatic-conference.js')
          need("cells?.[12]" in automatic,'Relatório mensal pode apagar a coluna de Pedidos ao tratar contagem física opcional.')
          need('paymentDifference' not in automatic.split('buildSaveWarnings=function(record){',1)[-1].split("if(typeof refreshDailyReport",1)[0],'Diferença entre Resumo e canais voltou a bloquear/alertar o salvamento.')

          delivery=read('delivery-cash.js')
          need('id="deliveryCash"' in delivery and 'Dinheiro (Entregas)' in delivery,'Campo Dinheiro (Entregas) não é criado corretamente.')
          need('daySales' not in delivery and 'paymentTotal' not in delivery,'Módulo visual de entregas voltou a sobrescrever regras financeiras.')

          backup=read('backup-protection.js')
          for target in ('rpc/save_cash_closing','rpc/delete_cash_closing','rpc/restore_cash_backup','rpc/restore_deleted_cash_closing'):
              need(target in backup,f'Snapshot automático não cobre operação crítica: {target}')
          need("format:'xburguer-caixa-backup-v2'" not in backup or 'FORMAT=' in backup,'Backup protegido perdeu formato centralizado.')
          need("algorithm:'SHA-256'" in backup,'Backup protegido perdeu SHA-256.')

          consistency=read('data-consistency.js')
          need("breads[prefix+'Final']=final" in consistency,'Normalização não preserva estoque final.')
          need("breads[prefix+'Prod']=start-final" in consistency,'Produção de pães não usa Inicial - Final.')

          bread_rule=read('bread-start-final.js')
          need('idealProd:idealStart-idealFinal' in bread_rule and 'gourmetProd:gourmetStart-gourmetFinal' in bread_rule,'Registro de pães não calcula produção corretamente.')
          need('O estoque final do ${name} não pode ser maior que o estoque inicial.' in bread_rule,'Validação de pães foi removida.')
          need('exportCSV=function' not in bread_rule and 'exportJSON=function' not in bread_rule,'Módulo de pães não deve sobrescrever exportações globais.')

          realtime=read('realtime.js')
          need('realtimeStartPromise' in realtime and 'nextReconnectDelay' in realtime,'Realtime perdeu serialização/backoff.')
          need("const realtimeDisabled=()=>window.__XB_E2E__===true" in realtime,'Realtime não está explicitamente isolado do E2E.')
          need('if(realtimeDisabled())return false' in realtime,'Realtime ainda pode iniciar no E2E.')
          need('},30000);' in realtime,'Verificação periódica do Realtime está agressiva demais.')

          system_guard=read('system-guard.js')
          need('importInProgress' in system_guard and "importBtn')?.disabled" not in system_guard,'Proteção crítica confunde arquivo inválido com importação ativa.')

          app5=read('app5.js')
          need('rpc/restore_cash_backup' in app5,'Restauração atômica de backup não está ativa.')
          need('importInProgress=true' in app5 and 'importInProgress=false' in app5,'Estado da importação crítica não é controlado.')
          need('appRevealTimer' in app5,'Animação de entrada não possui proteção contra corrida com logout.')
          need('enterOfflineMode' in app5,'Modo offline seguro não está ativo.')
          need('Descartar e carregar' in app5,'Proteção de rascunho local foi removida.')

          currency=read('currency-format.js')
          need("'deliveryCash'" in currency,'Campo Dinheiro (Entregas) não recebe formatação BRL.')
          need('function normalizeTypedNumber(value)' in currency and 'Padrão brasileiro: 1.234,56 -> 1234.56.' in currency,'Parser BRL robusto foi removido.')
          need('parse:parseTyped' in currency,'Parser monetário deixou de ser testável pela suíte E2E.')

          online_css=read('online-orders-equal.css')
          need('minmax(0,1fr) minmax(0,1fr)' in online_css,'Quantidade e valor dos pedidos online deixaram de ter larguras iguais.')

          readme=read('README.md')
          need(f'Versão funcional atual: **{app_version}**' in readme,'README está com versão incorreta.')
          need('Saldo Inicial **não é venda**' in readme,'README não documenta a regra do saldo inicial.')
          need('Dinheiro previsto = Saldo Inicial + Dinheiro (Caixa) + Dinheiro (Entregas) - retiradas para despesas' in readme,'README não documenta a conferência física.')
          need('Produção = Estoque inicial - Estoque final' in readme,'README não documenta a regra dos pães.')

          # Isolamento e práticas proibidas.
          runtime=[p for p in root.glob('*.js')]+[root/'index.html',root/'caixa.html',root/'manifest.webmanifest']
          forbidden=['/xburguer-controle/','xburguer-consumo-','rrslolruacewjijlhpdc']
          for path in runtime:
              if not path.exists():continue
              text=path.read_text(encoding='utf-8',errors='ignore')
              for token in forbidden:
                  if token in text:errors.append(f'{path}: referência proibida ao outro sistema: {token}')
              if 'window.confirm(' in text:errors.append(f'{path}: confirmação nativa do navegador encontrada.')

          for name in ('caixa.html','index.html','system-hardening.js','automatic-conference.js','bread-start-final.js','security-hardening.js','e2e-adapter.js','system-guard.js'):
              text=read(name)
              need('4.18.2' not in text,f'{name}: referência de versão 4.18.2 ainda ativa.')

          if errors:
              print('\n'.join('ERRO: '+e for e in errors))
              sys.exit(1)
          print('OK: Caixa validado em regras financeiras, relatórios, PWA, backup, isolamento, pães, Realtime, rascunhos e operações críticas.')
          PY

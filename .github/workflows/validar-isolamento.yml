name: Validar X-Burguer Caixa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done

      - name: Validar manifesto, isolamento e versão
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys

          root = Path('.')
          errors = []

          manifest = json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('id') != '/xburguer-caixa/caixa-oficial':
              errors.append('Manifest ID oficial do Caixa foi alterado.')
          if manifest.get('scope') != '/xburguer-caixa/':
              errors.append('Manifest scope do Caixa foi alterado.')
          if not str(manifest.get('start_url','')).startswith('/xburguer-caixa/'):
              errors.append('start_url do Caixa saiu do caminho exclusivo.')
          if manifest.get('display') != 'standalone':
              errors.append('Modo standalone do Caixa foi alterado.')

          required_icons = {
              './icons/xburguer-caixa-192-v4150.png',
              './icons/xburguer-caixa-512-v4150.png',
              './icons/xburguer-caixa-maskable-512-v4150.png'
          }
          manifest_icons = {str(icon.get('src','')) for icon in manifest.get('icons', [])}
          if not required_icons.issubset(manifest_icons):
              errors.append('Manifest não contém todos os ícones oficiais do Caixa.')
          for rel in [p[2:] for p in required_icons]:
              if not (root/rel).exists():
                  errors.append(f'Ícone obrigatório ausente: {rel}')

          index = (root/'index.html').read_text(encoding='utf-8')
          if 'system-hardening.js?v=4.18.1' not in index:
              errors.append('Index não carrega a camada de estabilidade na publicação v4.18.1.')
          if 'app5.js?v=4.18.1' not in index:
              errors.append('Index não carrega a lógica final na publicação v4.18.1.')
          if 'automatic-conference.js?v=4.18.1' not in index:
              errors.append('Index não carrega a conferência automática v4.18.1.')
          if 'cash-conference-help.js?v=4.18.1' not in index:
              errors.append('Index não carrega a ajuda da conferência v4.18.1.')
          if 'pwa.js?v=4.18.1' not in index:
              errors.append('Index não carrega o registrador PWA v4.18.1.')

          hardening = (root/'system-hardening.js').read_text(encoding='utf-8')
          if 'pageSize=500' not in hardening:
              errors.append('Carregamento paginado do histórico não foi encontrado.')
          if 'xbIsNetworkError' not in hardening:
              errors.append('Proteção de sessão contra falha de internet não foi encontrada.')

          conference = (root/'automatic-conference.js').read_text(encoding='utf-8')
          if "const AUTO_VERSION='4.18.1';" not in conference:
              errors.append('Versão da conferência automática não é 4.18.1.')
          if 'cashCountVerified' not in conference:
              errors.append('Flag de contagem física opcional não foi encontrada.')
          if 'buildSaveWarnings=function' not in conference:
              errors.append('A conferência automática não controla os avisos de salvamento.')

          app5 = (root/'app5.js').read_text(encoding='utf-8')
          if 'rpc/restore_cash_backup' not in app5:
              errors.append('Restauração atômica de backup não está ativa no frontend.')
          if 'enterOfflineMode' not in app5:
              errors.append('Modo offline seguro não foi encontrado.')
          if 'Descartar e carregar' not in app5:
              errors.append('Proteção contra descarte acidental de rascunho não foi encontrada.')

          sw = (root/'service-worker.js').read_text(encoding='utf-8')
          if 'const CACHE_NAME = "xburguer-caixa-pwa-v4.18.1";' not in sw:
              errors.append('Cache do Caixa não está na versão 4.18.1.')
          if 'const APP_PATH = "/xburguer-caixa/";' not in sw:
              errors.append('Service Worker perdeu o limite de caminho.')
          if 'Promise.allSettled' not in sw:
              errors.append('Precache resiliente do PWA não foi encontrado.')
          if 'automatic-conference.js' not in sw:
              errors.append('Service Worker não inclui a conferência automática.')
          if 'caches.match(' in sw:
              errors.append('Service Worker usa busca global de cache da origem.')

          pwa = (root/'pwa.js').read_text(encoding='utf-8')
          if '/xburguer-caixa/service-worker.js?v=4.18.1' not in pwa:
              errors.append('PWA não registra o Service Worker v4.18.1.')
          if "scope:'/xburguer-caixa/'" not in pwa:
              errors.append('Registro PWA não está preso ao caminho exclusivo.')

          storage = (root/'storage-namespace.js').read_text(encoding='utf-8')
          if "const NS = 'xburguer_caixa::';" not in storage:
              errors.append('Storage do Caixa não usa namespace exclusivo.')

          app1 = (root/'app1.js').read_text(encoding='utf-8')
          if 'trnngxezppeembrvxkhh.supabase.co' not in app1:
              errors.append('Supabase do Caixa foi alterado.')
          if 'rrslolruacewjijlhpdc' in app1:
              errors.append('Caixa contém referência ao banco do outro sistema.')

          runtime_files = [
              root/'index.html', root/'manifest.webmanifest', root/'service-worker.js',
              root/'pwa.js', root/'sw.js', root/'app1.js', root/'app2.js', root/'app3.js',
              root/'app4.js', root/'app5.js', root/'storage-namespace.js',
              root/'system-hardening.js', root/'automatic-conference.js', root/'realtime.js'
          ]
          forbidden = ['/xburguer-controle/', 'xburguer-consumo-', 'rrslolruacewjijlhpdc']
          for path in runtime_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      errors.append(f'{path}: referência proibida do outro sistema: {token}')
              if 'window.confirm(' in text:
                  errors.append(f'{path}: confirmação nativa do navegador encontrada.')

          version_css = (root/'version.css').read_text(encoding='utf-8')
          if '4.18.1' not in version_css:
              errors.append('Versão visível não é 4.18.1.')

          if errors:
              print('\n'.join('ERRO: '+e for e in errors))
              sys.exit(1)

          print('OK: X-Burguer Caixa v4.18.1 validado em sintaxe, conferência automática, PWA, isolamento e estabilidade.')
          PY

name: Temporary Supabase CDN hash
on:
  push:
    branches:
      - audit/realtime-backup-hardening-20260918
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate pinned CDN SHA-384
        shell: bash
        run: |
          set -euo pipefail
          url='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js'
          hash="$(curl -fsSL "$url" | openssl dgst -sha384 -binary | base64 -w0)"
          echo "SRI=sha384-$hash"

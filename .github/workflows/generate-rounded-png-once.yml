name: Gerar PNG arredondado do Caixa - uma vez

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-rounded-png-once.yml

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Pillow
        run: python -m pip install --quiet pillow

      - name: Gerar PNGs arredondados do ícone original
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageChops
          from pathlib import Path

          src = Path('icons/xburguer-caixa-512-v4150.png')
          img = Image.open(src).convert('RGBA')
          if img.size != (512, 512):
              img = img.resize((512, 512), Image.Resampling.LANCZOS)

          scale = 4
          mask_big = Image.new('L', (512*scale, 512*scale), 0)
          draw = ImageDraw.Draw(mask_big)
          draw.rounded_rectangle(
              (0, 0, 512*scale-1, 512*scale-1),
              radius=112*scale,
              fill=255
          )
          mask = mask_big.resize((512, 512), Image.Resampling.LANCZOS)
          img.putalpha(ImageChops.multiply(img.getchannel('A'), mask))

          for size in (32, 48, 180, 192, 512):
              icon = img if size == 512 else img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(f'icons/xburguer-caixa-rounded-{size}-v2.png', optimize=True)
          PY

      - name: Salvar os PNGs no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/xburguer-caixa-rounded-*-v2.png
          git commit -m "Gerar PNGs arredondados reais do ícone do Caixa"
          git push origin HEAD:main

name: Aplicar correcoes da revisao geral

on:
  push:
    branches: [audit/revisao-geral-4182]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/revisao-geral-4182

      - name: Preparar geracao de icone
        run: python -m pip install --quiet pillow

      - name: Consolidar regras e gerar icone 512
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          def replace(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              n=text.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: esperado {expected}, encontrado {n} para {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          # Regra oficial da conferencia fisica no codigo-base, sem depender apenas do hardening.
          replace('app2.js',
              "const expectedCash=n('opening')+n('cash')-n('cashOut');",
              "const expectedCash=n('cash')-n('cashOut');",
              expected=2)

          # Controle de paes: a regra atual deve ser a fonte de verdade tambem ao normalizar dados antigos.
          replace('app2.js',
              "if(r.breads.idealOut===undefined)r.breads.idealOut=0;\n  if(r.breads.gourmetOut===undefined)r.breads.gourmetOut=0;\n  if(r.breads.idealFinal===undefined)r.breads.idealFinal=Number(r.breads.idealStart||0)-Number(r.breads.idealProd||0);\n  if(r.breads.gourmetFinal===undefined)r.breads.gourmetFinal=Number(r.breads.gourmetStart||0)-Number(r.breads.gourmetProd||0);",
              "r.breads.idealOut=0;\n  r.breads.gourmetOut=0;\n  r.breads.idealFinal=Number(r.breads.idealStart||0)-Number(r.breads.idealProd||0);\n  r.breads.gourmetFinal=Number(r.breads.gourmetStart||0)-Number(r.breads.gourmetProd||0);"
          )

          # Relatorios e utilitarios-base seguem as mesmas regras da camada final.
          replace('app4.js',
              "expectedCash=Number(r.expectedCash??((r.opening||0)+(r.cash||0)-(r.cashOut||0)))",
              "expectedCash=Number(r.expectedCash??((r.cash||0)-(r.cashOut||0)))")
          replace('app4.js',
              "function exportJSON(){const data={version:4.11,exportedAt:new Date().toISOString(),records:load()};",
              "function exportJSON(){const data={version:(window.XB_APP_VERSION||'4.18.2'),exportedAt:new Date().toISOString(),records:load()};")
          replace('app4.js',
              "function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}",
              "function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}")

          # Gera a versao 512 do mesmo icone arredondado atual sem redesenhar logo ou cores.
          source=Image.open('icons/xburguer-caixa-512-v4150.png').convert('RGBA')
          alpha=Image.open('icons/xburguer-caixa-rounded-192-v3.png').convert('RGBA').getchannel('A')
          alpha=alpha.resize(source.size,Image.Resampling.LANCZOS)
          source.putalpha(alpha)
          source.save('icons/xburguer-caixa-rounded-512-v4.png',optimize=True)

          print('OK: regras-base consolidadas e PNG 512 gerado.')
          PY

      - name: Conferir sintaxe JavaScript
        run: |
          node --check app2.js
          node --check app4.js

      - name: Commitar correcoes
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app2.js app4.js icons/xburguer-caixa-rounded-512-v4.png
          git commit -m "Consolidar regras-base e gerar icone 512 [skip ci]"
          git push origin HEAD:audit/revisao-geral-4182

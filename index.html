<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X-Burguer Caixa</title>
<link rel="manifest" href="manifest.webmanifest?v=pwa-caixa-rounded-1">
<meta name="theme-color" content="#12293D">
<meta name="application-name" content="X-Burguer Caixa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X-Burguer Caixa">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=pwa-caixa-rounded-1">
<link rel="icon" type="image/svg+xml" href="icons/xburguer-caixa-rounded-v1.svg?v=pwa-caixa-rounded-1">
<link rel="icon" type="image/png" sizes="192x192" href="icons/xburguer-caixa-192-v4150.png?v=pwa-caixa-rounded-1">
</head>
<body>
<p>Abrindo X-Burguer Caixa...</p>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const expectedScope=new URL('/xburguer-caixa/',location.origin).href;
      const expectedScriptPath='/xburguer-caixa/service-worker.js';
      const registrations=await navigator.serviceWorker.getRegistrations();

      for(const old of registrations){
        if(old.scope!==expectedScope)continue;
        const scriptUrl=
          old.active?.scriptURL ||
          old.waiting?.scriptURL ||
          old.installing?.scriptURL ||
          '';

        if(scriptUrl && new URL(scriptUrl).pathname!==expectedScriptPath){
          await old.unregister();
        }
      }

      const reg=await navigator.serviceWorker.register(
        '/xburguer-caixa/service-worker.js?v=rounded-1',
        {scope:'/xburguer-caixa/',updateViaCache:'none'}
      );
      await reg.update().catch(()=>{});
      await navigator.serviceWorker.ready.catch(()=>{});
    }
  }catch(e){console.warn('PWA Caixa:',e)}

  location.replace('/xburguer-caixa/caixa.html?app=caixa');
})();
</script>
</body>
</html>
